name: 同步 MagicRule 规则

on:
  schedule:
    # 每天 04:43 UTC = 北京时间 12:43, 避开整点高峰。
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magicrule-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取规则
        run: python3 tools/sync_magicrule.py 2>&1 | tee /tmp/sync.log

      - name: 提交变更
        run: |
          if [ -z "$(git status --porcelain -- rule)" ]; then
            echo "规则无变化, 不提交"
            exit 0
          fi
          git config user.name "magicrule-bot"
          git config user.email "magicrule-bot@users.noreply.github.com"
          git add rule
          git commit -m "chore(magicrule): 同步规则集"
          git push

      - name: 变更摘要
        if: always()
        run: |
          {
            echo "### MagicRule 规则同步"
            echo ""
            echo '```'
            tail -40 /tmp/sync.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
