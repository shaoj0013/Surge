name: 定时更新 MagicRule 规则

on:
  schedule:
    # 每天 18:07 UTC = 北京时间 02:07。
    # 选在凌晨低峰: 避开整点 (GitHub 定时任务在整点最容易排队),
    # 也避开欧美白天的工作时段 —— 实测故障积压的调度会延后数小时才跑。
    - cron: "7 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 强制全量重抓 (忽略增量状态)
        type: boolean
        default: false
      fast:
        description: 快速模式 (按 rule_updated_at 预筛, 省流量但可能漏更新)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: magicrule-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取规则
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.fast }}" = "true" ]; then ARGS="$ARGS --fast"; fi
          python3 magicrule/tools/fetch_magicrule.py Surge $ARGS 2>&1 | tee /tmp/fetch.log

      - name: 合并策略组
        run: python3 magicrule/tools/build_groups.py 2>&1 | tee /tmp/groups.log

      - name: 提交变更
        run: |
          if [ -z "$(git status --porcelain -- magicrule/surge)" ]; then
            echo "规则无变化, 不提交"
            exit 0
          fi

          SUMMARY=$(grep -E '^(更新|完成)' /tmp/fetch.log | tr '\n' ' ' | sed 's/  */ /g')
          SUMMARY="$SUMMARY $(grep -E '^分组清单' /tmp/groups.log)"
          git config user.name "magicrule-bot"
          git config user.email "magicrule-bot@users.noreply.github.com"
          git add magicrule/surge
          git commit -m "chore(magicrule): 自动更新规则集" -m "$SUMMARY"
          git push

      - name: 变更摘要
        if: always()
        run: |
          {
            echo "### MagicRule 自动更新"
            echo ""
            echo '```'
            grep -E '^(更新|完成|  )' /tmp/fetch.log | head -30 || true
                echo ""
                grep -E '^(分组清单|  )' /tmp/groups.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
